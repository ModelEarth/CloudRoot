name = "llm-proxy-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Secrets (ANTHROPIC_API_KEY, OPENAI_API_KEY) are NOT set here.
# They're pushed at deploy time via `wrangler secret put`, driven by
# GitHub Actions secrets — see .github/workflows/deploy-worker.yml
# and README.md.

[vars]
# Non-secret config can go here, e.g.:
# DEFAULT_PROVIDER = "anthropic"

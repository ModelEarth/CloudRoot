name: Deploy Chat (Next.js) to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "chat/**"
      - ".github/workflows/deploy-chat-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # chat is a git submodule — pull its contents

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build with OpenNext
        run: npm run cf:build

      - name: Deploy to Cloudflare
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Add any chat-specific secrets (e.g. auth provider keys) the
          # same way — as repo/environment secrets, referenced here.
